<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmileSchool</title>
  <meta name="description" content="Get schooled — Learn from the pros">
</head>
<body>
  <!-- Header -->
  <header>
    <!-- Link con imagen (logo) -->
    <a href="/" aria-label="SmileSchool home">
      <img src="logo.png" alt="SmileSchool logo">
    </a>

    <!-- Bloque con 3 enlaces -->
    <nav aria-label="Primary">
      <a href="#">Courses</a>
      <a href="#">Pricing</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <!-- Secciones siguientes se irán llenando en tasks posteriores -->
  <main>
  <section aria-labelledby="hero-title">
    <!-- Bloque superior: título + texto + botón -->
    <div>
      <h1 id="hero-title">Get schooled</h1>
      <p>SMILES • GRIN • LAUGH</p>
      <button type="button">REGISTER FOR FREE</button>
    </div>

    <!-- Bloque inferior: “Learn from the pros” + 4 tarjetas -->
    <div>
      <h2>Learn from the pros</h2>

      <div>
        <article>
          <img src="pro-1.jpg" alt="Philip Massey">
          <h3>Philip Massey</h3>
          <p>« Smile of the year » 2018–2019</p>
        </article>

        <article>
          <img src="pro-2.jpg" alt="Nannie Lawrence">
          <h3>Nannie Lawrence</h3>
          <p>Best « little smile » 2017</p>
        </article>

        <article>
          <img src="pro-3.jpg" alt="Bruce Walters">
          <h3>Bruce Walters</h3>
          <p>Best « friend smile » live performance 2019</p>
        </article>

        <article>
          <img src="pro-4.jpg" alt="Henry Hughes">
          <h3>Henry Hughes</h3>
          <p>« 24h smiles » winner 2016–2019</p>
        </article>
      </div>
    </div>
  </section>
</main>

  <footer></footer>
</body>
</html>
